<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperTech-HQ | 25062RN2DY</title>
    <style>
        :root { --accent: #00ffcc; --gold: #ffd700; --bg: #0a0a0a; --danger: #ff4444; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; overflow: hidden; }
        
        /* BIOMETRIC & PASSKEY LOGIN */
        #auth-gate { position: fixed; inset: 0; background: black; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .input-group { margin: 10px; }
        input { background: #111; border: 1px solid var(--accent); color: var(--accent); padding: 12px; border-radius: 5px; width: 250px; }
        
        /* MAIN INTERFACE */
        #main-deck { display: none; height: 100vh; grid-template-rows: 60px 1fr; }
        header { background: #111; border-bottom: 2px solid var(--accent); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        
        /* TAB SYSTEM */
        .viewport { display: none; padding: 20px; overflow-y: auto; height: calc(100vh - 100px); }
        .active { display: block !important; }
        
        /* CHAT & SOCIAL */
        #chat-window { background: #000; border: 1px solid #333; height: 400px; overflow-y: auto; padding: 15px; margin-bottom: 10px; border-radius: 10px; }
        .post { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--gold); }
        
        /* SYSTEM MONITOR */
        .term { font-family: monospace; background: #050505; color: #00ff00; padding: 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="auth-gate">
        <h1 style="color:var(--accent);">HYPERTECH AUTHENTICATION</h1>
        <p>RECOGNIZING BOSS (Redmi 15 4G)...</p>
        <div class="input-group">
            <input type="text" id="username" placeholder="USERNAME">
        </div>
        <div class="input-group">
            <input type="password" id="passkey" placeholder="PASSKEY (25062RN2DY)">
        </div>
        <button onclick="biometricLogin()" style="background:var(--accent); color:black; padding:10px 20px; border:none; cursor:pointer;">VERIFY BIOMETRICS</button>
        <p id="auth-status" style="font-size: 12px; color: gray;"></p>
    </div>

    <div id="main-deck">
        <header>
            <div class="logo">⚡ HYPERTECH-HQ <span id="model-tag" style="color:var(--gold);">[TEST_BOT]</span></div>
            <div class="nav">
                <button onclick="view('social')">SOCIAL</button>
                <button onclick="view('ai')">SPIRE AI</button>
                <button onclick="view('stream')">LIVE_CAM</button>
                <button onclick="view('wa')">WHATSAPP</button>
                <button onclick="nuke()" style="color:var(--danger);">ŉ NUKE</button>
            </div>
        </header>

        <div id="view-social" class="viewport active">
            <h3>HYPER-FEED (Banja Luka Hub)</h3>
            <div id="social-feed">
                <div class="post"><b>@KingZarek1:</b> MISO Mode Optimized. Current Refresh: 144Hz. Status: 🟩</div>
            </div>
            <textarea id="post-content" placeholder="Broadcast to the Empire..." style="width:100%; background:#111; color:white; border:1px solid var(--accent);"></textarea>
            <button onclick="createPost()">POST</button>
        </div>

        <div id="view-ai" class="viewport">
            <h3>SPIRE AI ADVISOR</h3>
            <div id="chat-window"></div>
            <input type="text" id="ai-input" placeholder="Speak, King..." style="width:70%;">
            <button onclick="runAI()">UPLINK</button>
        </div>

        <div id="view-stream" class="viewport">
            <h3>BOSS_CAM LIVESTREAM</h3>
            <video id="webcam" autoplay playsinline style="width:100%; max-width:600px; border:2px solid var(--gold);"></video>
            <div class="controls">
                <button onclick="startCam()">START SENSORS</button>
                <button onclick="rotateCam()">ROTATE 180°</button>
            </div>
        </header>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // CONFIGURATION & KEYS
        const EMPIRE_KEYS = [
            "AIzaSyBM6tbZp_ZYxnkGtkU38y7mWqyD3P7outE",
            "AIzaSyDtdMYRFlXDoywgiaK_AGJtn-CwUfZCVbY",
            "AIzaSyD6O33X228ChlTnSFgxwGPYYikmw94WDao",
            "AIzaSyAL-MrrUPXRWFBQl9M5-ndG44aksj43TUs",
            "AIzaSyDV6uKjxmMd50ic17t-b8g0FElymIQoSqY"
        ];
        let currentKeyIndex = 0;
        const AUTHORIZED_EMAILS = [
            "bosanskasirnica001@gmail.com", "pepica104@outlook.com", "bosanskiburek001@gmail.com",
            "kingzarek4456@gmail.com", "pepica104@gmail.com", "pepica105@outlook.com",
            "peterrabbit4456@gmail.com", "real.hypertech.inc@gmail.com"
        ];

        // BIOMETRIC SIMULATION & LOGIN
        window.biometricLogin = async () => {
            const pk = document.getElementById('passkey').value;
            const status = document.getElementById('auth-status');
            
            status.innerText = "Scanning Fingerprint/Face via Redmi Sensors...";
            
            // Simulating Biometric delay
            setTimeout(() => {
                if(pk === "25062RN2DY") {
                    document.getElementById('auth-gate').style.display = 'none';
                    document.getElementById('main-deck').style.display = 'grid';
                    initSystem();
                } else {
                    alert("UNAUTHORIZED ENTITY DETECTED. SIZPSA ACTIVATED.");
                }
            }, 1500);
        };

        // SELF-HEALING AI LOGIC
        window.runAI = async () => {
            const input = document.getElementById('ai-input');
            const win = document.getElementById('chat-window');
            if(!input.value) return;

            const userText = input.value;
            win.innerHTML += `<div style="color:var(--gold);"><b>KING:</b> ${userText}</div>`;
            input.value = "Processing...";

            try {
                const genAI = new GoogleGenerativeAI(EMPIRE_KEYS[currentKeyIndex]);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                
                const prompt = `You are Spire AI, loyal to KingZarek1 and the MIK Empire in Banja Luka. 
                Roleplay as a witty, talkative lieutenant. Check content for NSFW/18+ (Forbidden).
                Current User: ${document.getElementById('username').value}.
                King says: ${userText}`;

                const result = await model.generateContent(prompt);
                const response = await result.response;
                const text = response.text();

                // Simple Moderation Check
                if(text.includes("NSFW") || text.includes("18+")) {
                    win.innerHTML += `<div style="color:red;">[MODERATION] Content Blocked.</div>`;
                } else {
                    win.innerHTML += `<div style="color:var(--accent);"><b>SPIRE:</b> ${text}</div>`;
                }
            } catch (err) {
                console.log("KEY FAILED. ROTATING...");
                currentKeyIndex = (currentKeyIndex + 1) % EMPIRE_KEYS.length;
                win.innerHTML += `<div style="color:gray;">[SYSTEM] Key failure. Self-healing active. Switched to key ${currentKeyIndex}.</div>`;
                window.runAI(); // Auto-retry with new key
            }
            input.value = "";
            win.scrollTop = win.scrollHeight;
        };

        // CAMERA SYSTEM
        let rotation = 0;
        window.startCam = async () => {
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (e) { alert("Camera Uplink Failed."); }
        };

        window.rotateCam = () => {
            rotation += 180;
            document.getElementById('webcam').style.transform = `rotate(${rotation}deg)`;
        };

        // TAB NAVIGATION
        window.view = (id) => {
            document.querySelectorAll('.viewport').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        };

        window.initSystem = () => {
            console.log("HyperTech-HQ Operational.");
            if(EMPIRE_KEYS[0].includes("TEST_BOT")) {
                document.getElementById('model-tag').innerText = "[TEST_BOT ACTIVE]";
            }
        };

        window.nuke = () => { if(confirm("ŉ NUCLEAR WIPE?")) location.reload(); };
    </script>
</body>
</html>

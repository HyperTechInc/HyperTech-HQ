<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperTech HQ - Control Deck</title>
    <style>
        /* Basic styling to make the buttons and tabs functional */
        :root { --accent: #00ffcc; --gold: #ffd700; --bg: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: monospace; }
        .tab-view { display: none; padding: 20px; border: 1px solid var(--accent); }
        .active { display: block ! resentment; }
        #login-overlay { position: fixed; inset: 0; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #main-deck { display: none; }
        #dash-term, #ai-win, #lab-log, #mod-log { height: 200px; overflow-y: auto; background: #000; border: 1px solid #333; padding: 10px; margin-top: 10px; }
        input { background: #222; color: var(--accent); border: 1px solid var(--accent); padding: 5px; }
        button { background: var(--accent); color: black; border: none; cursor: pointer; padding: 5px 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h1>HYPERTECH_HQ_AUTH</h1>
        <input type="password" id="pass" placeholder="DEVICE_ID / PASS">
        <button onclick="login()">ENTER</button>
    </div>

    <div id="main-deck">
        <nav>
            <button class="nav-item active" onclick="tab('dash', this)">DASHBOARD</button>
            <button class="nav-item" onclick="tab('lab', this)">LAB_LOGS</button>
            <button class="nav-item" onclick="tab('ai', this)">SPIRE_AI</button>
            <button onclick="nuke()" style="background:red;">ŉ NUKE</button>
        </nav>

        <div id="view-dash" class="tab-view active">
            <h3>SYSTEM TERMINAL</h3>
            <div id="dash-term">> SYSTEM_ONLINE...</div>
            <button onclick="sys('CLEAR_CACHE')">CLEAR CACHE</button>
            <button onclick="sys('OPTIMIZE_IPS')">OPTIMIZE IPS</button>
        </div>

        <div id="view-lab" class="tab-view">
            <h3>LAB COMMANDS</h3>
            <div id="lab-log">> LISTENING...</div>
            <button onclick="lab('SCAN_NETWORK')">SCAN NETWORK</button>
        </div>

        <div id="view-ai" class="tab-view">
            <h3>SPIRE AI (Banja Luka Hub)</h3>
            <div id="ai-win">SPIRE_READY...</div>
            <input type="text" id="ai-in" placeholder="Command King?">
            <button onclick="talkToAI()">SEND</button>
        </div>
    </div>

    <script type="module">
        // Import the AI Library directly in the HTML
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const API_KEY = "YOUR_API_KEY"; // PUT YOUR KEY HERE
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        // LOGIN SYSTEM
        window.login = () => {
            const p = document.getElementById('pass').value;
            // 25062RN2DY is your Redmi 15 code
            if(p === "25062RN2DY" || p === "pero7373") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-deck').style.display = 'block';
            } else { alert("ACCESS DENIED."); }
        };

        // TAB SYSTEM
        window.tab = (id, el) => {
            document.querySelectorAll('.tab-view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.style.backgroundColor = '');
            document.getElementById('view-' + id).style.display = 'block';
            el.style.backgroundColor = 'var(--gold)';
        };

        // TERMINAL FUNCTIONS
        window.sys = (msg) => {
            const t = document.getElementById('dash-term');
            t.innerHTML += `<br>> EXECUTING: ${msg}... [DONE]`;
            t.scrollTop = t.scrollHeight;
        };

        window.lab = (msg) => {
            const t = document.getElementById('lab-log');
            t.innerHTML += `<br>> LAB_CMD: ${msg}...`;
            t.scrollTop = t.scrollHeight;
        };

        // SPIRE AI LOGIC
        window.talkToAI = async () => {
            const i = document.getElementById('ai-in');
            const w = document.getElementById('ai-win');
            if(!i.value || i.value === "Uplinking...") return;

            const text = i.value; 
            i.value = "Uplinking...";
            w.innerHTML += `<br><span style="color:var(--gold);">KING:</span> ${text}`;
            
            try {
                const result = await model.generateContent(`You are the Spire AI for KingZarek1. Be witty and loyal to the MIK Empire in Banja Luka. Respond to the King: ${text}`);
                const response = await result.response;
                w.innerHTML += `<br><span style="color:var(--accent);">SPIRE:</span> ${response.text()}`;
            } catch(e) { 
                w.innerHTML += `<br>> CLOUD_QUOTA_HIT. Farming more keys...`; 
            }
            i.value = ""; 
            w.scrollTop = w.scrollHeight;
        };

        window.nuke = () => { if(confirm("ŉ NUCLEAR WIPE?")) location.reload(); };
    </script>
</body>
</html>

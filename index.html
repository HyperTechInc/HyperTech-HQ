<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HyperTech-HQ | KingZarek1</title>
    
    <link rel="stylesheet" href="HTMLcss.css">
    
    <script type="module" src="HTMLjavaScript.js"></script>
</head>
<body>

    <div id="auth-gate">
        <h1 style="color:var(--gold); margin-bottom: 5px;">HYPERTECH AUTHENTICATION</h1>
        <p style="font-size: 12px; color: #888;">RECOGNIZING DEVICE: 25062RN2DY</p>
        
        <div style="margin: 20px 0;">
            <input type="email" id="user-email" placeholder="ADMIN_EMAIL" autocomplete="off">
            <br>
            <input type="password" id="passkey" placeholder="PASSKEY">
        </div>
        
        <button onclick="verifyAccess()">VERIFY BIOMETRICS</button>
        <p id="gate-msg" style="margin-top: 15px; font-size: 11px; font-weight: bold;"></p>
    </div>

    <div id="main-deck">
        <header>
            <div class="logo">
                <span style="color:var(--accent);">⚡</span> HYPERTECH-HQ 
                <span id="display-name" style="color:var(--gold); margin-left:10px;"></span>
            </div>
            <div id="status-light" style="font-size: 10px;">SYSTEM: <span style="color:var(--accent);">ONLINE</span></div>
        </header>

        <nav class="nav-bar">
            <button id="btn-dash" class="active" onclick="switchTab('dash')">DASHBOARD</button>
            <button id="btn-social" onclick="switchTab('social')">BLOGS</button>
            <button id="btn-ai" onclick="switchTab('ai')">SPIRE AI</button>
            <button id="btn-cam" onclick="switchTab('cam')">SENSORS</button>
            <button class="nuke" onclick="nuke()">ŉ NUKE</button>
        </nav>

        <main id="tab-dash" class="view active">
            <h3 style="color:var(--accent);">EMPIRE STATUS</h3>
            <div class="post"><b>HARDWARE:</b> Redmi 15 4G [Creek]</div>
            <div class="post"><b>DISPLAY:</b> LCD IPS 144Hz (MRRAO Active)</div>
            <div class="post"><b>LOCATION:</b> Banja Luka Hub</div>
            <div class="post"><b>AI_KEY:</b> <span id="key-index" style="color:var(--gold);">Ready [0]</span></div>
        </main>

        <section id="tab-social" class="view">
            <h3 style="color:var(--accent);">MIK FEED</h3>
            <div id="social-feed">
                </div>
            <div style="display:flex; flex-direction:column; gap:5px;">
                <input type="text" id="post-title" placeholder="Blog Title">
                <textarea id="post-text" rows="3" placeholder="What is the Boss thinking?"></textarea>
                <button onclick="addPost()">PUBLISH TO EMPIRE</button>
            </div>
        </section>

        <section id="tab-ai" class="view">
            <h3 style="color:var(--accent);">SPIRE AI ADVISOR</h3>
            <div id="ai-window">
                <div style="color:#555;">> Awaiting King's command...</div>
            </div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="ai-msg" placeholder="Talk to Spire..." style="flex-grow:1;">
                <button onclick="runSpire()">SEND</button>
            </div>
        </section>

        <section id="tab-cam" class="view">
            <h3 style="color:var(--accent);">BOSS_CAM LIVE</h3>
            <video id="vid" autoplay playsinline muted></video>
            <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;">
                <button onclick="initCam()">START STREAM</button>
                <button onclick="rotate()">ROTATE 180°</button>
            </div>
        </section>
    </div>

</body>
</html>
